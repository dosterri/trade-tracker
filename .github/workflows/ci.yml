# Analyse + Tests bei jedem Push (Linux-Runner = günstigste Minuten).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Abhängigkeiten
        run: flutter pub get

      - name: flutter analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log

      - name: flutter test
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.log

      - name: Fehlerübersicht
        if: failure()
        run: |
          {
            echo "## ❌ CI fehlgeschlagen"
            if [ -f analyze.log ]; then
              echo "### flutter analyze"
              echo '```'
              grep -E "^\s*(error|warning|info) •" analyze.log | head -60 || true
              echo '```'
            fi
            if [ -f test.log ]; then
              echo "### Fehlgeschlagene Tests"
              echo '```'
              grep -E "\[E\]|Expected:|Actual:|Error:|Exception" test.log | head -80 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Zusammenfassung
        if: success()
        run: |
          echo "## ✅ Analyze & Tests grün" >> "$GITHUB_STEP_SUMMARY"
          grep -E "All tests passed|tests passed" test.log | tail -1 >> "$GITHUB_STEP_SUMMARY" || true

  backend:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typprüfung
        run: deno check supabase/functions/check-prices/index.ts supabase/functions/send-test/index.ts

      - name: Tests
        run: |
          set -o pipefail
          deno test --allow-net supabase/functions/_shared/shared_test.ts 2>&1 | tee deno.log

      - name: Fehlerübersicht
        if: failure()
        run: |
          {
            echo "## ❌ Backend-Prüfung fehlgeschlagen"
            echo '```'
            tail -60 deno.log 2>/dev/null || echo "Siehe Job-Log (Typprüfung)."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
